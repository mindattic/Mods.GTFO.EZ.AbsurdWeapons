# tcli publish config (release infra, not used by build.ps1). `tcli publish --file <dist zip> --token
# <token>` reads name/namespace/version/dependencies straight from the zip's own manifest.json, so
# [package] and [build] below are unused by that path and don't need to track the real version -
# only [publish]'s communities/categories matter for --file publishes.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "MindAttic"
name = "GtfoEZAbsurdWeapons"
versionNumber = "21.0.0"
description = "GTFO.EZ companion: eighteen new weapons marked (!): katana, Mjolnir, sledgehammer, stealth dagger; plasma, smart, laser, tentacle, grenade, rail, lightning, rocket and shrink-ray guns; a healing banner. Press a slot's key again to swap it mid-level."
websiteUrl = "https://github.com/mindattic/GTFO.EZ.AbsurdWeapons"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack_GTFO = "3.2.4"

[build]
icon = "./package/icon.png"
readme = "./package/README.md"
outdir = "./build"

[publish]
repository = "https://thunderstore.io"
communities = [ "gtfo" ]
[publish.categories]
gtfo = []
